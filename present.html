<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Firman Present Receiver
</title>

<style>

*{
  box-sizing:border-box
}

body{

  margin:0;

  background:#080b10;

  color:white;

  font-family:
  Arial,
  sans-serif

}

.wrap{

  max-width:1100px;

  margin:auto;

  padding:20px

}

h1{

  letter-spacing:2px;

  font-size:22px

}

.status{

  display:inline-block;

  padding:8px 12px;

  border:1px solid #27303d;

  border-radius:20px;

  background:#151b24;

  color:#ffd65a;

  margin-bottom:18px

}

.ok{
  color:#66ffb3
}

.stage{

  height:520px;

  display:grid;

  place-items:center;

  overflow:hidden;

  background:#11161e;

  border:1px solid #27303d;

  border-radius:20px

}

.slide{

  width:82%;

  height:78%;

  background:white;

  color:#111;

  border-radius:8px;

  display:grid;

  place-items:center;

  transform-origin:center;

  transition:
  transform .25s ease

}

.inner{
  text-align:center
}

.num{

  font-size:92px;

  font-weight:800

}

.label{

  font-size:24px;

  color:#555

}

.panel{

  display:flex;

  gap:12px;

  flex-wrap:wrap;

  margin-top:14px

}

.chip{

  padding:10px 13px;

  background:#151b24;

  border:1px solid #27303d;

  border-radius:12px

}

.small{

  color:#9ca6b5;

  font-size:13px;

  margin-top:12px

}

button{

  padding:12px 16px;

  background:#151b24;

  color:#fff;

  border:1px solid #27303d;

  border-radius:12px;

  font-size:15px

}

</style>

</head>

<body>

<div class="wrap">

<h1>
FIRMAN PRESENT RECEIVER
</h1>

<div
  id="status"
  class="status"
>
FIREBASE : CONNECTING...
</div>


<div class="stage">

  <div
    id="slide"
    class="slide"
  >

    <div class="inner">

      <div class="label">
        DEMO SLIDE
      </div>

      <div
        id="slideNum"
        class="num"
      >
      1
      </div>

      <div
        id="actionText"
        class="label"
      >
      Waiting for gesture…
      </div>

    </div>

  </div>

</div>


<div class="panel">

  <div class="chip">

    Slide:

    <b id="s">
      1
    </b>

  </div>


  <div class="chip">

    Zoom:

    <b id="z">
      100%
    </b>

  </div>


  <div class="chip">

    Last command:

    <b id="last">
      —
    </b>

  </div>


  <button id="reset">
    RESET DEMO
  </button>

</div>


<div class="small">

Buka halaman ini di laptop kantor.

iPhone controller akan mengubah slide demo ini secara realtime.

</div>

</div>


<script>

const DB =
"https://firman-gesture-default-rtdb.asia-southeast1.firebasedatabase.app";


let slide = 1;

let zoom = 1;

let lastNonce = null;


const $ =
id =>
document.getElementById(id);


function render(action=""){

  $("slideNum")
  .textContent =
  slide;


  $("s")
  .textContent =
  slide;


  $("z")
  .textContent =
  Math.round(
    zoom * 100
  )
  +
  "%";


  $("slide")
  .style
  .transform =
  `scale(${zoom})`;


  if(action){

    $("last")
    .textContent =
    action;


    $("actionText")
    .textContent =
    action;

  }

}


function apply(cmd){

  if(
    !cmd ||
    !cmd.action
  ){

    return;

  }


  if(
    cmd.nonce &&
    cmd.nonce ===
    lastNonce
  ){

    return;

  }


  lastNonce =
  cmd.nonce ||
  null;


  const a =
  cmd.action;


  if(
    a ===
    "NEXT"
  ){

    slide =
    Math.min(
      99,
      slide + 1
    );

  }


  else if(
    a ===
    "PREVIOUS"
  ){

    slide =
    Math.max(
      1,
      slide - 1
    );

  }


  else if(
    a ===
    "ZOOM_IN"
  ){

    zoom =
    Math.min(
      2.5,
      zoom + .2
    );

  }


  else if(
    a ===
    "ZOOM_OUT"
  ){

    zoom =
    Math.max(
      .6,
      zoom - .2
    );

  }


  render(a);

}


function connect(){

  const es =
  new EventSource(

    DB +
    "/gesture/command.json"

  );


  const handler =
  e => {

    try{

      const payload =
      JSON.parse(
        e.data
      );


      if(
        payload &&
        payload.data
      ){

        apply(
          payload.data
        );

      }


      $("status")
      .textContent =
      "FIREBASE : CONNECTED";


      $("status")
      .className =
      "status ok";

    }

    catch(err){

      console.error(err);

    }

  };


  es.addEventListener(
    "put",
    handler
  );


  es.addEventListener(
    "patch",
    handler
  );


  es.onerror =
  () => {

    $("status")
    .textContent =
    "FIREBASE : RECONNECTING...";


    $("status")
    .className =
    "status";

  };

}


$("reset")
.addEventListener(

  "click",

  () => {

    slide = 1;

    zoom = 1;

    render(
      "RESET"
    );

  }

);


render();

connect();

</script>

</body>

</html>
